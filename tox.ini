# `uv run tox` -- lint, type-check, test against a built wheel, then cut a distribution.
#
# Running the suite against the *installed wheel* rather than `src/` is the point of
# this file: it catches anything that works from the source tree but is missing from
# the package -- an unlisted subpackage, a stray `py.typed`, a forgotten dependency.
#
#   uv run tox                  every env below, in order
#   uv run tox -e py312         just the tests
#   uv run tox -e dist          just build dist/
#   uv run tox -e integration   opt-in, needs the REST catalog + MinIO up
#   uv run tox -- -k pushdown   arguments after `--` go to pytest
#
# tox-uv builds every environment with uv, so these share the resolver and cache the
# rest of the project already uses.

[tox]
requires =
    tox>=4.21
    tox-uv>=1.16
env_list = lint, type, py312, dist

[testenv]
description = Run the test suite against the built wheel
package = wheel
wheel_build_env = .pkg
extras = dev
commands = pytest {posargs}

[testenv:lint]
description = ruff lint + format check
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:type]
description = mypy, over src/ scripts/ tests/ (paths come from pyproject)
extras = dev
commands = mypy

[testenv:dist]
description = Build the sdist and wheel into dist/
skip_install = true
deps = uv
# Only stale artifacts are cleared -- `dist/` itself is left in place, because uv keeps
# a generated `.gitignore` there that should survive a rebuild.
commands =
    python -c "import pathlib; [f.unlink() for f in pathlib.Path('dist').glob('icetl-*')]"
    uv build --out-dir dist
    python -c "import pathlib; print('built:', ', '.join(sorted(f.name for f in pathlib.Path('dist').glob('icetl-*'))))"

[testenv:integration]
description = Integration tests against the live REST catalog + MinIO (opt-in)
extras = dev
# `.env` is read from the working directory, which tox sets to the project root.
passenv =
    ICETL_*
    AWS_*
commands = pytest -m integration {posargs}
