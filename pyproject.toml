[project]
name = "icetl"
version = "0.0.1"
description = "DataFrame and SQL transformation engine over Apache Iceberg, executed by DuckDB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Arun" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "pyiceberg[s3fs,pyarrow,sql-sqlite,glue,hive]>=0.11.1,<0.12",
  "duckdb>=1.5.5,<2",
  "sqlglot>=30.17.0,<31",
  "pyarrow>=25.0.1",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.0",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
notebook = ["ipykernel>=6.29", "jupyterlab>=4.2"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "hypothesis"]

[project.scripts]
icetl-smoke = "icetl.diagnostics.smoke:main"

# Installed by `uv run` without any flag, which is what makes `uv run tox` work.
# The tooling tox needs *inside* its environments comes from the `dev` extra above;
# only tox itself has to live out here.
[dependency-groups]
dev = ["tox>=4.21", "tox-uv>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/icetl"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/icetl/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pandas.*", "pyiceberg.*", "pyarrow.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the live REST catalog + MinIO (deselected by default)",
  "slow: an integration test that scans at real scale; adds minutes, not seconds",
]
# Integration tests are opt-in: `uv run pytest -m integration`.
#
# `slow` is a second axis on top of `integration`, never a marker on its own -- which is
# why this line needs no change to keep deselecting everything that touches the network:
#
#   pytest                                  the local suite, offline
#   pytest -m "integration and not slow"    the fast tier, target under 5 minutes
#   pytest -m integration                   everything, including the 41M-row scans
addopts = "-m 'not integration' --strict-markers"
filterwarnings = ["error::DeprecationWarning:icetl.*"]
